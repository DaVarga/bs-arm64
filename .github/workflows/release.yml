# Build the ARM64 DLLs and publish them as a GitHub release.
#   push a tag v*        -> build, package, create the release with the tarball
#   run manually         -> build and package only (tarball as a workflow artifact)
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # build.sh cross-compiles and works on either arch; set the BS_ARM64_RUNNER repository
    # variable to ubuntu-24.04 if Arm runners aren't available for this repository.
    runs-on: ${{ vars.BS_ARM64_RUNNER || 'ubuntu-24.04-arm' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, for the version in the package name

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo NEEDRESTART_MODE=a apt-get install -y --no-install-recommends \
            git curl python3 make gcc patch flex bison autoconf perl pkg-config \
            cmake ninja-build meson glslang-tools

      # Toolchain, upstream checkouts and Wine's generated headers; keyed on the pins.
      - uses: actions/cache@v4
        with:
          path: deps
          key: deps-${{ runner.arch }}-${{ hashFiles('versions.env', 'patches/**', 'build.sh') }}

      - name: Build
        run: ./build.sh

      - name: Package
        run: |
          BS_ARM64_VERSION=${{ github.ref_type == 'tag' && github.ref_name || '' }} \
          BS_ARM64_REPO_URL=${{ github.server_url }}/${{ github.repository }} \
            ./build.sh package

      - name: Check installer and package contents
        run: |
          bash -n build.sh install/bs-arm64.sh
          python3 tools/test_installer_runtime.py
          for package in dist/*.tar.gz; do
            tar tzf "$package" | grep '/ucrtbs64.dll$'
            tar tzf "$package" | grep '/vcruntime140.dll$'
            tar tzf "$package" | grep '/msvcp140.dll$'
          done

      - uses: actions/upload-artifact@v4
        with:
          name: bs-arm64
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/bs-arm64-manifest.json
            dist/RELEASE_NOTES.md

      - name: Create release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source versions.env
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.tar.gz.sha256 dist/bs-arm64-manifest.json \
            --verify-tag --title "$GITHUB_REF_NAME (${PROTON_TAGS// /, }, Beat Saber ${BS_VERSIONS%% *}–${BS_VERSIONS##* })" \
            --notes-file dist/RELEASE_NOTES.md
